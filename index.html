<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CJS 96 Awards Night</title><style>
:root{color-scheme:dark;--gold:#e4bc70;--ink:#080d19}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#fbf1db;font-family:Georgia,serif;background-image:radial-gradient(ellipse at top,#26344c 0,transparent 62%)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:5px}header{text-align:center;padding:54px 20px 34px}.eyebrow{letter-spacing:5px;color:var(--gold);font:12px Arial,sans-serif}h1{font-size:clamp(40px,7vw,80px);margin:18px 0 12px;font-weight:400}header p{color:#b9bbc4;font:16px/1.7 Arial,sans-serif}.date{color:var(--gold);font-style:italic}.grid{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px}.award{position:relative;text-align:left;border:1px solid #b9944b55;background:linear-gradient(130deg,#202b3d,#111a29);color:#f7e6c5;padding:28px;min-height:157px;transition:transform .2s,border-color .2s}.award:hover{transform:translateY(-4px);border-color:var(--gold)}.award .number{display:block;color:var(--gold);font:11px Arial;letter-spacing:3px;margin-bottom:15px}.award strong{display:block;font-size:24px;font-weight:400}.award small{display:block;color:#aeb6c6;font:12px Arial;margin-top:17px}.award.seen small{color:var(--gold)}footer{text-align:center;color:#a8acb6;font:12px/2 Arial;padding:30px 20px 44px}footer b{color:var(--gold);letter-spacing:2px;margin:0 16px}dialog{padding:0;border:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;background:#050912;color:white;overflow:hidden}dialog::backdrop{background:#000}.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:70px 22px 80px;overflow:hidden;background:radial-gradient(ellipse at center,#283047,#050912 75%)}.close,.sound{position:absolute;top:20px;z-index:20;background:#101927d9;color:#eed9ad;border:1px solid #bea46666;padding:11px 17px;font:14px Arial}.close{right:20px}.sound{left:20px}.stage-title{z-index:5;font:14px Arial;letter-spacing:4px;color:var(--gold);text-align:center;margin-bottom:20px}.suspense{position:absolute;inset:90px 0 50px;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center}.rolling{font-size:clamp(34px,8vw,95px);color:#ffe8b5;text-align:center;text-shadow:0 0 50px #ffc75e66;animation:namepop .3s ease-out}.count{font:12px Arial;letter-spacing:5px;color:#d8bf92;margin:35px 0}.progress{width:min(320px,65vw);height:2px;background:#ffffff22}.progress i{display:block;height:100%;width:0;background:var(--gold)}.floating{position:absolute;pointer-events:none;font:clamp(15px,2vw,27px) Georgia;color:#dfc59288;animation:floatname 1.1s both}.curtain{position:absolute;top:0;bottom:0;width:50.5%;z-index:4;background:repeating-linear-gradient(90deg,#3e0610 0,#8b172a 7%,#580914 14%,#28040a 18%);box-shadow:inset 0 0 100px #0009;transition:transform 1.5s cubic-bezier(.65,0,.25,1)}.left{left:0;border-right:3px solid #bd9454}.right{right:0;border-left:3px solid #bd9454}.revealed .left{transform:translateX(-102%)}.revealed .right{transform:translateX(102%)}.result{width:100%;max-width:1250px;text-align:center;opacity:0;transition:opacity .8s .4s;z-index:3;min-height:0}.revealed .result{opacity:1}.winner{font-size:clamp(25px,4vw,48px);color:var(--gold);margin:0 0 15px}.certificate{max-height:calc(100dvh - 240px);max-width:100%;width:auto;object-fit:contain;box-shadow:0 8px 70px #0009}.actions{position:absolute;bottom:20px;z-index:10;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;pointer-events:none}.revealed .actions{opacity:1;pointer-events:auto}.actions button,.actions a{padding:12px 20px;border:1px solid #ba9a59;background:#131b2b;color:#f1d6a0;font:13px Arial;text-decoration:none}.spark{position:absolute;z-index:8;pointer-events:none;width:7px;height:13px;background:var(--gold);animation:confetti 2.8s ease-in forwards}@keyframes namepop{from{opacity:.2;transform:scale(.78)}to{opacity:1;transform:scale(1)}}@keyframes floatname{0%{opacity:0;transform:translateY(20px) scale(.8)}30%{opacity:.65}100%{opacity:0;transform:translateY(-60px) scale(1.15)}}@keyframes confetti{to{transform:translateY(110vh) rotate(680deg);opacity:0}}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.award{padding:20px;min-height:145px}.award strong{font-size:20px}header{padding-top:40px}.stage{padding-inline:8px}.stage-title{font-size:11px;letter-spacing:2px}.certificate{max-height:calc(100dvh - 250px)}footer b{margin:0 6px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.award{min-height:115px}.award small{margin-top:10px}}@media(prefers-reduced-motion:reduce){.floating{display:none}.curtain{transition:none}.rolling{animation:none}.spark{display:none}}
